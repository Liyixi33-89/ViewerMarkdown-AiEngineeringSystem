server {
    listen 8081;
    server_name 111.231.57.177;

    root /opt/mdviewer/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端静态资源长缓存（内容 hash 文件名）：强缓存 30 天 + immutable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML：禁强缓存走协商缓存（保证发版秒级生效）
    location = /index.html {
        add_header Cache-Control "no-cache";
        # no-cache 不是不缓存：是每次发请求协商（304 则用本地），保证引用新 hash
    }

    # API 反代到 Spring Boot：即时数据一律不缓存
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        # 浏览器与中间层都不缓存（/portal/version 轮询必须拿真值）
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # 前端路由回退（/doc/:id、/admin）：回退的 HTML 同样禁强缓存
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
